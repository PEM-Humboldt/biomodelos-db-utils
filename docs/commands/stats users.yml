title: stats users
description: Comando para realizar consultas sobre usuarios registrados en BioModelos.

examples:

  - title: Estadísticas sobre usuarios
    cmd: "bmdbutils stats users"

notes: 

  - title: "Prerequisitos"
    description: Es necesario haber realizado la configuración a las base de datos a traves del comando [setup](setup.md).

  - title: "Parámetros"
    auto_help: true

  - title: "Consideraciones" 
    description: |
        - El comando retorna resultados históricos.

  - title: "Comportamiento del comando"
    description: |
        - El comando consulta estadísticas sobre usuarios registrados en BioModelos.
        - No modifica ni elimina información.
        - Los resultados se muestran directamente en consola.
