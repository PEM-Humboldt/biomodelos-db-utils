title: stats downloads
description: Subcomando para realizar consultas sobre descargas de modelos de BioModelos.
examples:
  - title: Listar descargas
    cmd: "bmdbutils stats downloads"

notes: 

  - title: "Prerequisitos"
    description: Es necesario haber realizado la configuración a las base de datos a traves del comando [setup](setup.md).

  - title: "Parámetros"
    auto_help: true

  - title: "Consideraciones" 
    description: |
        - El subcomando retorna resultados históricos.

  - title: "Comportamiento del subcomando"
    description: |
        - El subcomando consulta estadísticas de descargas de modelos de la plataforma BioModelos.
        - No modifica ni elimina información.
        - Los resultados se muestran directamente en consola.
