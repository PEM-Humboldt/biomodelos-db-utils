title: stats downloads
description: Comando para realizar consultas sobre descargas de modelos de BioModelos.
examples:
  - title: Listar descargas
    cmd: "bmdbutils stats downloads"

notes: 

  - title: "Prerequisitos"
    description: Es necesario haber realizado la configuracióna las base de datos a traves del comando [setup](setup.md).
  - title: "Parámetros"
    auto_help: true

  - title: "Consideraciones" 
    description: |
        - El comando retorna resultados históricos.
        
  - title: "Comportamiento del comando"
    description: |
        - El comando consulta estadísticas de descargas de modelos de la plataforma BioModelos.
        - No modifica ni elimina información.
        - Los resultados se muestran directamente en consola.
