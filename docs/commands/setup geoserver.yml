title: setup geoserver
description: Configura la conexión al Geoserver de BioModelos. Esta configuración es obligatoria para la ejecución de otros comandos.

examples:
  - title: Configurar Geoserver.
    cmd: "bmdbutils setup geoserver --url http://localhost:8080/geoserver --username username"

notes: 
  - title: "Parámetros"
    auto_help: true
    
  - title: "Consideraciones" 
    description: |
        - Este subcomando no es necesario ejecutarlo si ya se ha realizado la configuración previamente.
        - El parámetro `--password` es obligatorio y el sistema lo solicita automáticamente. 

  - title: "Comportamiento del subcomando"
    description: |
        - Guarda la configuración de conexión del Geoserver para ser utilizada por otros comandos de bmdbutils.
        - Sobrescribe la configuración existente si ya ha sido definida previamente.
        - No valida la disponibilidad del Geoserver en el momento de la ejecución.
        
  - title: "Valores por defecto"
    description: |
        - `--url`: URL de Geoserver.
        - `--username`: Nombre de usuario para acceder a Geoserver.

  - title: "Validaciones"
    description: |
        - Las URL deben ser escritas sin el prefijo http, de lo contrario puede interpretar erróneamente el puerto.
        - Todos los parámetros son obligatorios si no existe una configuración previa.
  