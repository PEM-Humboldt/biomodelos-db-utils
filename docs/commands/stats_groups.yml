title: Groups

command: stats groups

description: Subcomando para realizar consultas sobre los grupos de expertos en BioModelos.

notes:
  - title: "Prerequisitos"
    description: Es necesario haber realizado la configuración inicial de [Postgres](setup_postgres.md).

  - title: "Parámetros"
    auto_help: true

  - title: "Consideraciones" 
    description: |
        - El subcomando retorna resultados históricos.

  - title: "Comportamiento del subcomando"
    description: |
        - El subcomando consulta la cantidad de grupos de expertos en la plataforma BioModelos.
        - No modifica ni elimina información.
        - Los resultados se muestran directamente en consola.
