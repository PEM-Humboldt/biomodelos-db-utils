title: records upload
description: Subcomando que permite cargar datos de un archivo CSV que contienen el esquema necesario a la colección Records de la base de datos MongoDB de BioModelos.

examples:
  - title: Cargar datos de un archivo CSV a la colección Records.
    cmd: "bmdbutils records upload /path/to/records.csv /path/to/output/folder"

notes: 
  - title: "Parámetros"
    auto_help: true

  - title: "Consideraciones" 
    description: |
        - Para los argumentos `CSV_FILE` y `OUT_FOLDER` se debe proporcionar la ruta absoluta del archivo CSV y la carpeta donde desea los resultados de la validación.

  - title: "Comportamiento del subcomando"
    description: |
        - El subcomando valida si el archivo CSV tiene el esquema necesario.
        - El subcomando inserta documentos en la colección `records`.
        - Si ocurre un error durante la carga realiza un `rollback`.
        - El subcomando no elimina registros existentes.

  - title: "Validaciones"
    description: |
        - El archivo CSV debe existir y ser accesible desde el sistema.
        - El archivo debe cumplir con la estructura esperada por BioModelos. 
