title: Geoserver

command: setup geoserver

description: Subcomando para configurar la conexión al Geoserver de BioModelos. Esta configuración es obligatoria para la ejecución de otros comandos.

notes: 
  - title: "Parámetros"
    auto_help: true

  - title: "Consideraciones" 
    description: |
        - Una vez realizada la configuración inicial de este subcomando, no es necesario ejecutarlo de nuevo.
        - El parámetro `--password` es obligatorio y el sistema lo solicita automáticamente. 

  - title: "Comportamiento del subcomando"
    description: |
        - Guarda la configuración de la conexión del Geoserver para ser utilizada por otros comandos de `bmdbutils`.
        - Sobrescribe la configuración existente si ya ha sido definida previamente.
        - No valida la disponibilidad del Geoserver en el momento de la ejecución.

  - title: "Valores por defecto"
    description: |
        - `--url`: http://localhost:8080/geoserver.
        - `--username`: admin.
        - `--password`: solicitado automáticamente.

  - title: "Validaciones"
    description: |
        - La URL debe contener el protocolo (http, https, etc), de lo contrario puede interpretar erróneamente el puerto.
        - Todos los parámetros son obligatorios si no existe una configuración previa.
