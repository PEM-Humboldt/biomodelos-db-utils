title: Ratings

command: models ratings

description: Subcomando para obtener las calificaciones otorgadas a modelos correspondientes a las especies indicadas.

notes: 

  - title: "Prerequisitos"
    description: Es necesario haber realizado la configuración inicial de [Postgres](setup_postgres.md).

  - title: "Parámetros"
    auto_help: true

  - title: "Consideraciones" 
    description: |
        - Para el argumento `OUT_FOLDER` se debe proporcionar la ruta absoluta de la carpeta donde desea los resultados del subcomando.
        - Si se realizan múltiples consultas sobre el mismo rango de fechas, el CSV resultante se sobreescribe.

  - title: "Comportamiento del subcomando"
    description: |
        - El subcomando consulta las calificaciones a los modelos asociados a las especies indicadas.
        - El subcomando no modifica ni elimina información en la base de datos.

  - title: "Estructura del resultado"
    description: |
        El resultado es un archivo CSV que contiene los siguientes campos:
            - user_id: Identificador del usuario que creó o añadió el registro.
            - name: Nombre del usuario que creó o añadió el registro.
            - model_id: Identificador del modelo del GeoServer.
            - species_id: Identificador de la especie.
            - accepted_name: Nombre aceptado de la especie.
            - score: Calificación.

  - title: "Valores por defecto"
    description: |
        - Si no se especifican `--init-date` y `--end-date`, el comando retorna los registros correspondientes al último mes a partir de la fecha de consulta.

  - title: "Validaciones"
    description: |
        - Las fechas deben ser proporcionadas en formato YYYY-MM-DD.
        - El parámetro `--tax-ids` debe ir precedido por al menos un identificador de especie. 
