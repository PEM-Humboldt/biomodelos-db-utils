title: stats groups
description: Subcomando para realizar consultas sobre grupos de expertos en BioModelos.
examples:
  - title: Listar cantidad de grupos
    cmd: "bmdbutils stats groups"

notes: 

  - title: "Prerequisitos"
    description: Es necesario haber realizado la configuración a las base de datos a traves del comando [setup](setup.md).

  - title: "Parámetros"
    auto_help: true

  - title: "Consideraciones" 
    description: |
        - El subcomando retorna resultados históricos.

  - title: "Comportamiento del subcomando"
    description: |
        - El subcomando consulta la cantidad de grupos de expertos en la plataforma BioModelos.
        - No modifica ni elimina información.
        - Los resultados se muestran directamente en consola.
