title: Stats
description: Comando para realizar consultas SQL y NoSQL relacionadas con estadísticas de uso de BioModelos.
examples:
  
  - title: Cantidad de modelos descargados
    cmd: "bmdbutils stats downloads"
  
  - title: Cantidad de grupos en la plataforma
    cmd: "bmdbutils stats groups"
  
  - title: Cantidad de modelos disponibles
    cmd: "bmdbutils stats models"
  
  - title: Cantidad de usuarios registrados
    cmd: "bmdbutils stats users"

notes: 

  - title: "Prerequisitos"
    description: Es necesario haber realizado la configuracióna las bases de datos usando el comando [setup](setup.md).
  - title: "Parámetros"
    auto_help: true

  - title: "Consideraciones" 
    description: |
        - El comando retorna resultados históricos.
        
  - title: "Comportamiento del comando"
    description: |
        - El comando consulta estadísticas de uso de la plataforma BioModelos.
        - No modifica ni elimina información.
        - Los resultados se muestran directamente en consola.

  - title: "Subcomandos"
    description: |
        - [stats downloads](stats downloads.md).
        - [stats groups](stats groups.md).
        - [stats models](stats models.md).
        - [stats users](stats users.md).
