title: Models

command: stats models

description: Subcomando para realizar consultas sobre modelos disponibles en BioModelos.

notes:
  - title: "Prerequisitos"
    description: Es necesario haber realizado la configuración inicial de [Mongo](setup_mongo.md).

  - title: "Parámetros"
    auto_help: true

  - title: "Consideraciones" 
    description: |
        - El subcomando retorna resultados históricos.

  - title: "Comportamiento del subcomando"
    description: |
        - El subcomando consulta estadísticas sobre modelos disponibles en BioModelos.
        - No modifica ni elimina información.
        - Los resultados se muestran directamente en consola.
