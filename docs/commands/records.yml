title: Records
description: Permite validar y cargar registros de un archivo CSV a la colección Records de la base de datos MongoDB de BioModelos.

examples:
  - title: Validar esquema de datos de un archivo CSV a la colección Records.
    cmd: "bmdbutils records validate /path/to/records.csv /path/to/output/folder"

  - title: Cargar un documento a una colección records.
    cmd: "bmdbutils records upload /path/to/records.csv /path/to/output/folder"

notes: 
  - title: "Parámetros"
    auto_help: true

  - title: "Consideraciones" 
    description: |
        - El comando `setup` debe ejecutarse antes de ejecutar cualquier otro comando. En caso de que la configuración ya exista, este no será necesario.
        - Se recomienda ejecutar primero el subcomando `validate` y posteriormente `upload`.
        - Para los comandos de validación y carga, se debe proporcionar la ruta absoluta del archivo CSV.

  - title: "Comportamiento del comando"
    description: |
        - Comando base para los subcomandos `validate` y `upload`.
        - El subcomando `validate` no modifica información en la base de datos.
        - El subcomando `upload` inserta documentos en la colección `records`.
        - Ninguno de los subcomandos elimina registros existentes.

  - title: "Subcomandos"
    description: |
        - [records validate](records validate.md)
        - [records upload](records upload.md)
